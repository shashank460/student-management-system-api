name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-jwt-secret-change-me-please-123456
      REFRESH_TOKEN_SECRET: test-only-refresh-secret-change-me-please-123456
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Build Docker image
        run: docker build -t student-management-system-api:ci .
